    function NoneBndj(){if(event.target.closest('.bndj')||event.target.classList.contains('NObj')){return}else{None($$('.bndj'))}}
    function NavPag(Typ){Atual.Pag=Typ ; Show(`#Pag_${Typ}`,$$('#PAGES > *'))}
    function ReObj(tr){OBJ_ORC[getClssIN(tr,'ORC_tr-')]=$$('.dadoD',tr).map(e=>vAL2(e))}
    function RelodOBJ(){OBJ_ORC={} ; $$('#ORC .ORC_tr').forEach(tr=>ReObj(tr))}

        const Tm_ORC_Th=ary=>ary.map(e=>`<th class="${e==''?'':'O_Tx'}">${e==''?'':`<a>${e}</a><p>${D_Brev[e]}</p>`}</th>`).join('')
        const Tm_Total=E=>{
            const tm=(e,stg)=>`<div class="ORC_${e} ${stg}" name="0">${Tm_RS(0)}</div>`
            const viagem = [`CUST_${E} none`,`CRCT_${E} none`].map(e=>`<div class="Ct">${tm(e,'wp1')}${tm(e,'wp2')}</div>`).join('')
            return viagem+tm(`RSUT_${E}`)
        }
    // Ações
        const Check_W_Pag=()=>{if(window.innerWidth<=650){$$('#ORC .O_Tx').forEach(th=>Show($('a',th),$('p',th)))}
                               if(window.innerWidth> 650){$$('#ORC .O_Tx').forEach(th=>Show($('p',th),$('a',th)))}};window.addEventListener("resize",Check_W_Pag)
    // Add, Rmv, Clear
        const RmvORC=tr=>tr.remove()
        const ClrORC=tr=>{Clear($$('input',tr)) ; InnRsult(tr,0,[0,0],[0,0],0)}
        const ClrAll=()=>{$$(`#ORC tbody tr`                  ).forEach(tr=>ClrORC(tr))            ; Rload_Tbl() }
        const RmvAll=()=>{$$(`#ORC tbody tr:not(:first-child)`).forEach(tr=>RmvORC(tr)) ; ClrAll() ; Rload_Tbl() }
        const AddORC=tr=>{const Tr=tr.cloneNode(true) ; ClrORC(Tr) ; Insert(Pai(tr)).After(Tr,tr)  ; ORCnewID(Tr) ; Rload_Tbl()}

        const Bckg=e=>`style="background-image:url('./Prod/Avanc/${e}')"`
        const sP=(Stg,tr)=>$(`.o${Stg} span` ,tr)
        const sI=(Stg,tr)=>$(`.o${Stg} input`,tr)

    // Tornar Genérico
    function ShowVrnts(e){$$('.DivVrnts > div',Avo(e)).forEach((E,x)=>{
        $$('div',Pai(e)).forEach((B,x,l)=>{Rmv(B,'Atv')
            if(x < IdxDe(e)){Add(B,'Pre');Rmv(B,'Pos') ; B.style.zIndex = (l.length+x)-IdxDe(e)+10}
            else{            Add(B,'Pos');Rmv(B,'Pre') ; B.style.zIndex = (l.length-x)+IdxDe(e)+10}})
        Add(e,'Atv')
        if(x===IdxDe(e)){Show(E)}else{None(E)}
    })}

    // Handlers 
    function Upp_Tabela(Tbl){
        $$(`${Tbl} tbody tr`).length == 1 ? None($$('.OrcRmv',$(Tbl))) : Show($$('.OrcRmv',$(Tbl))) // Remover o X
        $$(`${Tbl} tbody tr`).length == 1 ? None($$('.O_All')) : Show($$('.O_All'))
    }
    function Upp_RowCol(Tbl){
        const Lmt = $$(`${Tbl} tr:nth-child(1) input`).length
        $$(`${Tbl} input`).forEach((I,x)=>{I.dataset.row = Math.floor(x/Lmt) ; I.dataset.col = x % Lmt})
    }
    function HandArrow(Tbl,e){
        if (e.key === "Enter"){
            const Inpts = $$(`input`,Tbl)
            const Elemt = $(':focus')
            const Next = Inpts[Array.from(Inpts).indexOf(Elemt)+1]
            if(Next){Next.focus() ; Next.select() }}
        let act = document.activeElement
        if (act.tagName !== "INPUT") return
        let r = +act.dataset.row, c = +act.dataset.col, nxt
        if (e.key === "ArrowRight") nxt = `[data-row='${ r }'][data-col='${c+1}']`
        if (e.key === "ArrowLeft")  nxt = `[data-row='${ r }'][data-col='${c-1}']`
        if (e.key === "ArrowDown")  nxt = `[data-row='${r+1}'][data-col='${ c }']`
        if (e.key === "ArrowUp")    nxt = `[data-row='${r-1}'][data-col='${ c }']`
        if (nxt){$(nxt)?.focus() ; setTimeout(()=>$(nxt)?.select(),0)}
    }

    const VAAL = e => e?.value ?? e?.querySelector('input,select')?.value ?? null

    const vAL=(s,e)=>
        s=='Imgs' ?     VAAL($('.oImgs',_tr(e)))  :
        s=='Serv' ?     VAAL($('.oServ',_tr(e)))  :
        s=='Tipo' ?     VAAL($('.oTipo',_tr(e)))  :
        s=='Matr' ?     VAAL($('.oMatr',_tr(e)))  : 
        s=='Cbmt' ?     VAAL($('.oCbmt',_tr(e)))  :
        s=='Lrg'  ? Num(VAAL($('.oLrg' ,_tr(e)))) :
        s=='Alt'  ? Num(VAAL($('.oAlt' ,_tr(e)))) :
        s=='Qnt'  ? Num(VAAL($('.oQnt' ,_tr(e)))) :
        s=='Lamn' ?          $('.oLamn',_tr(e) ).checked  :
        s=='Aplc' ?          $('.oAplc',_tr(e) ).checked  :
        null

    const vAL2=e=>{
        const s = getClssIN(e,'Md_')
        return  s=='Md_Slt' ? $('input',e)?.value  :
                s=='Md_Num' ?  Num(e?.value)||0    :
                s=='Md_Chk' ?      e?.checked      :
                s=='Md_Img' ? ''                   : null
    }
</script>

<script> // Templates
    function Navegar(Todos,Eu){Todos.forEach(e=>Add_N(e)) ; Rmv_N(Eu)}
    const ReadSVG=()=>readSVGFiles(SVG_FILES,(svg)=>AddCarr(svg,'Recorte','','','',''))

    function AddBoxy(e){LOG('',...e.split('_'));AddCarr('',...e.split('_'))} // tentar tirar isso daqui só serve pra desconstruir
    function Tm_Tabelado(Bx,ON){
        const Tm_R$ =e=>`<div class="TMRS Abslt Ct"><b>R$</b><p>${e}</p><b>,00</b></div>`
        const TmRSS =e=>e == 0 ? `<b class="Ct Abslt Indisdp">Indisponível</b>` : Tm_R$(e)
        const BoxVlr=e=>`<div class="BxVlr bckG Rltv HOV" ${Bckg('Base.svg')} onclick="AddBoxy('${e[1]}_${e[0][4]}_${e[0][0]}')">
                            <p class="V1 Abslt">${e[0][0]} UND   </p>
                            <p class="V2 Abslt">${TmRSS(e[0][1])}</p>
                            <p class="V3 Abslt">${(Num(e[0][1])/Num(e[0][0])).toFixed(2)}</p>
                        </div>`
        return `<div class="Armz bckG Cl Rltv" name="${Bx}" ${Bckg(`${Bx}.webp`)}><a class="Abslt Cl">${ON.filter(Y=>Y[1]==Bx).map(Y=>BoxVlr(Y)).join('')}</a></div>`
    }

    function Tm_Prods(LIstaa,Gabiarra){
        return LIstaa.map(e=>{
            const CADOO = Gabiarra=='1' ? J['PROD'].find(p=>p.Prod==e) : Prod[e]
            const P = CADOO
            if(!P){return ''}
            const Fora = P.img=='Place' ? './SVG/placeholder.svg' : null
            const TblA = P.Prvw=='Tabela'
            const iSVG = P.Prvw=='IptSVG'
            const ON   = FiltOn(e)
            const Flts = Gabiarra=='1' ? P.Tipos.map(e=>e.Item) : ObjKey(P.Tipos).filter(e=>e!='Todos')
            const VVV  = P ? ['Todos',...Flts] : ''
            const VARI = (VVV.length==2 && VVV[0]=='Todos' && VVV[1]==e) ? ['Todos',...Flts] : VVV
            const novo = (arr)=>arr.map(u=>u?.[1] ?? null)
            const Brvv = {Masculino:'Masc',Feminino:'Femi'}
            const Add=(V,Src)=>`onclick="AddCarr('${Src}',${V?.Dado?.map(e=>`'${e}'`).join(',')})"`

            return `<div class="Rltv Start2">
                <span class="Start"><img ${TblA ? `class="PT" onclick="TOV(this);Gmbrr(this)"` : ''}  src="${Fora||`./Prod/IconProd/${e}.svg`}"><div class="Start2"><h3 class="rgx">${e}</h3><p class="rgx">${P.Desc}</p></div></span>
                <div class="KeyInn none">...</div>

                <div class="Ct w100 Opts Abslt">${
                    VARI.map((V,x,l)=>{const L = l.length ; const U = L==1 ? 0 : 15
                        const CS1 = `left:${(x*(200/L))-(x==0?0:U)}px ; width:${(200/L)+U}px ; z-index:${(L-x)+10}`
                        const CS2 = `left:${(x*(270/L))-(x==0?0:U)}px ; width:${(270/L)+U}px ; z-index:${(L-x)+10}`
                        return `<div style="${CS1}" name="${CS2}" onclick="ShowVrnts(this)" class="Ct Abslt PT Pos ${x===0?'Atv':''}"><a class="none rgx">${V}</a> <img name="${V}" src="${Fora || `./Prod/IconProd/${V=='Todos'?`${V}`:`${e}_${V}`}.svg`}"></div>`
                    }).join('')}
                </div>

                <div class="Ct DivVrnts">${
                    VARI.map((V,x)=>{
                        const j    = vV=>P.Tipos.find(p=>p.Item==vV)
                        const TUDO = V=='Todos'
                        const Xo   = {'ímã':'I','Trofeu':'T','Quadro':'I'}
                        const XXO  = `${['Todos',...Flts].length-1}${Xo[e]||''}`
                        const Src  =(vV)=>Fora||`./Prod/${e}_${V}${vV?'_'+vV:''}.webp`

                        return `<div class="Box3 Conteudo Pecq ${TblA?'Table':''} Cl ${x===0?'':'none'}">
                        ${P.Disp ? '' : `<div class="Ct Abslt offf">Indisponível no momento...</div>`}
                        <div class="KeyVari rgx">${V}</div>
                            ${TblA && e=='Camisa' ? `<div class="Variate2">${Uniq(novo(ON).map(b=>b.split('_')[2])).map(s=>`<a class="PT HOV" onclick="MudaArmzn(this,'${V}')" name="${s}">${Brvv[s]||s}</a>`).join('')}</div>`:``}
                            ${TblA && e=='Camisa' ? `<div class="Variate2">${Uniq(novo(ON).map(b=>b.split('_')[3])).map(s=>`<a class="PT HOV" onclick="MudaArmzn(this,'${V}')" name="${s}">${s         }</a>`).join('')}</div>`:``}
                            ${TUDO && iSVG        ? `<div class="Cl"><input id="svgInput" ${InptSVG}><button onclick="ReadSVG()">Carregar</button></div>`
                            : TUDO && TblA        ? `<div class="Ct">${Uniq(novo(ON))                                    .map(Bx=>Tm_Tabelado(Bx,ON)).join('')}</div>`
                            :!TUDO && TblA        ? `<div class="Ct">${Uniq(novo(ON)).filter(s=>s.includes(`${e}_${V}_`)).map(Bx=>Tm_Tabelado(Bx,ON)).join('')}</div>`
                            : TUDO                ? `<div class="Ct fotO${XXO}">${Flts.map((vV)=>`<img class="Hov" src="${Src(vV)}" ${Add(j(vV),Src(vV))}>`).join('')}</div>`
                            /*de UND*/            : `<div class="Ct fotO      ">                  <img class="Hov" src="${Src(  )}" ${Add(j(V ),Src(  ))}>            </div>`
                        }
                        ${!TUDO/*&&P.Calc=='M2'*/ ? `<div class="Ct vlM2">${Tm_RS(V.Valr)}<p>m²</p></div>`:''}
                        <div class="rgx none">${(HotKy[e]||[]).join(',')}</div>
                        <a class="Abslt BtnGrid none">${SVG.Gemn}</a>
                        ${/*<div>Prazo 3 dias</div>*/''}
                        <img class="Abslt BtnCarr HOV" onclick="AddCarr('${e}','${V}')" src="./SVG/Adicionar.svg">
                        </div>`
                    }).join('')}
                </div>
            </div>`
        }).join('')
    }

    function AddCarr(Imgs,Serv,Tipo,Cbmt,Matr,Qnt){
        const Arr=[['Serv',Serv],['Tipo',Tipo],['Cbmt',Cbmt],['Matr',Matr]]
        const ut=()=>$$('.OrcAdd').slice(-1)[0]   // Pega o Ultimo
        if(vAL('Serv',ut())!=="") DispClick(ut()) // Cria uma Linha Nova se Precisar
        const tr=_tr(ut())                        // Pega agora essa Nova Linha
        Inn($('.oImgs',tr),Imgs.includes('.webp') ? `<img src="${Imgs}">` : Imgs)
        Arr.forEach(([c,v],i)=>{const el=$(`.o${c} input`,tr) ; Vll(el,v) ; if(c=='Serv'){ChangE(el,'Tipo')} ; if(c=='Tipo'){ChangE(el,'Cbmt')} })
        return tr
    }

    function ChangE(Div,col,X){ // a Função que Troca os Options Conforme Seleciona
        const tr = _tr(Div)
        const B = Object.fromEntries(['Serv','Tipo','Cbmt','Matr'].map(e=>[e,vAL(e,tr)])) // Valor Escolhido
        const P = J['PROD'].find(p=>p.Prod==B.Serv)                                       // Obj Encontrado
        if(LISTOFST.includes(B.Serv)){return} // GAMBIARRA
        const Dados = col=='Tipo' ? P.Tipos.map(e=>e.Item)  : ''                          // eliminar este array, pra deixar tudo em Objetos
        const Opt   = col=='Tipo' ? P.Opts : 'List'                                       // se não for Change em Serv todo resto fica List por enquanto (Melhorar isso!)
        const Matrr = col=='Cbmt' ? P.Tipos.find(e=>e.Item==B.Tipo)?.matr : null
        const Matr1 = J['MATR'].filter(e=>Matrr?.[0].includes(e.Id))
        const Matr2 = J['MATR'].filter(e=>Matrr?.[1].includes(e.Id))
        if(col=='Cbmt'){
                 Exec(col   ,Matr1?.map(e=>e.Item))
                 Exec('Matr',Matr2?.map(e=>e.Item))
        }else{   Exec(col,Dados)}
        function Exec(coll,DadosS){
            Inn(sP(coll,tr),Tm_MyOpts(DadosS||[],Opt))                                // dar o Inner do MyOpts a (lista,Forma de Exibire)
            if(!DadosS.includes(vAL(coll,tr)||'')){Vll(sI(coll,tr),'')}               // Analisar depois se precisa de Disparo
            if(DadosS.length==1){Vll(sI(coll,tr),DadosS[0]) ; Dispinput(sI(coll,tr))} // se tiver apenas um Seleciona ele e dispara
        }
    }

    function Orcamento(){
        $$('#ORC .ORC_tr').forEach(tr=>{ // tem que rodar orçamento em todas Linhas pra cada vez que acontecer uma edição          
            const Crecent3=(M,V,A=1.5,D=.3)=>{if(M<=1) return +(V*(1+A*(1-M**.6))).toFixed(2) ; return +(V*(1-D*((Math.min(M,10)-1)/9)**.7)).toFixed(2)}
            let [Serv,Tipo,Cbmt,Matr,Lrg,Alt,Qnt] = ['Serv','Tipo','Cbmt','Matr','Lrg','Alt','Qnt'].map(e=>vAL(e,tr))
            const Exec=(e,vai)=>{
                if(!e){return [0,0,0]}
                const E = J['MATR'].find(ee=>ee.Item==e)               // tentar fazer isso usando o ID do MATR pra ficar mais Certo, e poder usar JJ
                CheckLimit(E,$('.oLrg',tr),$('.oAlt',tr),Lrg,Alt)      // Conferir se tem Limite e da o Aviso
                const m2    = E.Calc=='M2' ? Lrg*Alt*Qnt : 0           // Define o Tipo de Calculo
                const m2Grl = ObjVal(OBJ_ORC).reduce((s,v)=>v[vai]==e?s+v[5]*v[6]*v[7]:s,0) // Soma todos M2 presentes na Tabela, antes de Definir o Valor pra Crescente
                return [m2*E.Cust,m2*E.Valr,m2*Crecent3(m2Grl,E.Valr)] // Custo , Valor , Desconto
            }
            const A1=Exec(Cbmt,3), A2=Exec(Matr,4)
            InnRsult(tr,Qnt,A1,A2,A1[2]+A2[2])
        })
            // if(false){ // 'Calc = M2v'
            //     const svg = $('.oImgs svg',tr).outerHTML
            //     const R   = CalcSVG(svg,[Lrg,Alt,Qnt],BS_Mtras[Tipo])
            //     LOG('Corte: ',R.Cort,'Mtrl: ',R.Mtrl)
            //     InnRsult(tr,Qnt,2,R.Cort+R.Mtrl,(R.Cort+R.Mtrl)*1.15) // (tr,Qnt,Cust,Crcnt,Valr)
            // }
    }

    const InNa_RS=(e,v)=>{const V=isNaN(v)?0:v ; Inn(e,Tm_RS(V)) ; Nm(e,V) ; if(V==0){Add(e,'Branc')}else{Rmv(e,'Branc')}}
    function ReloadTotal(){
        [['CUST','.wp1'],['CUST','.wp2'],['CRCT','.wp1'],['CRCT','.wp2'],['RSUT','']].forEach(([E,Wp])=>{
        const Valor = SOMA($$(`.ORC_${E}_SbTt${Wp}`).map(e=>Nm(e)))
        InNa_RS($(`.ORC_${E}_FINAL${Wp}`),Valor)
    })}
    function InnRsult(tr,Qnt,Arr1,Arr2,Valr){
        const Exec=(Arr,Wp)=>{
            const [Cust,Crct] = Arr
            InNa_RS($(`.ORC_CUST_Vund.${Wp}`,tr),(Cust/Qnt||0))
            InNa_RS($(`.ORC_CRCT_Vund.${Wp}`,tr),(Crct/Qnt||0))
            InNa_RS($(`.ORC_CUST_SbTt.${Wp}`,tr),Cust)
            InNa_RS($(`.ORC_CRCT_SbTt.${Wp}`,tr),Crct)
        } ; Exec(Arr1,'wp1') ; Exec(Arr2,'wp2') 
            InNa_RS($(`.ORC_RSUT_Vund`,tr),(Valr/Qnt||0))
            InNa_RS($(`.ORC_RSUT_SbTt`,tr),Valr)
        ReloadTotal()
    }
</script>
