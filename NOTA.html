


            <div class="Cl none">                   
                <div class="Cl"><input id="Compmnt" type="text" placeholder="Comprimento" value="0"></div>
                <div class="Cl none"><button class="Ct" onclick="ValTogg('#BackCub','0','1')">Completar Cubo</button><input id="BackCub" class="none" value="0"></div>
                <button class="none" onclick="Gera3d($('#NewCanvas'))">Roda 3D</button>
            </div>
            
            <div onload="Inn(this,Tm_DataNatora())"></div>
            <div class="Ct">
                <input id="valor" type="number" placeholder="Valor em R$" oninput="simular()">
                <button onclick="simular()">Simular</button>
                <table>
                    <thead><tr><th>Parcelas</th><th>Taxa</th><th>Total (R$)</th><th>Parcela (R$)</th></tr></thead>
                    <tbody id="res"></tbody>
                </table>
            </div>



            <script>
                    function simular(){
                        const v=+valor.value;if(!v)return alert("Digite um valor!")
                        Inn(res,TaxaMpag.map((t,i)=>{const tot=v*(1+t),parc=tot/(i+1);return `<tr><td>${i+1}x</td><td>${(t*100).toFixed(2)}%</td><td>${tot.toFixed(2)}</td><td>${parc.toFixed(2)}</td></tr>`}).join(''))
                    }

            </script>
