                <script>
                    function Calc_HORA(e){
                        CalcHoraCorte(e)
                        // joga aqui a parte do DOM, a parte que controla o HTML
                    }
                    async function CalcHoraCorte(e){ // esta função deve apenas Retornar os Resultados
                        if(!e.files[0]) return
                        const txt = await e.files[0].text()
                        const doc = new DOMParser().parseFromString(txt,'image/svg+xml')
                        const svg = doc.documentElement
                        const vb  = svg.viewBox.baseVal
                        let escala
                        $('#Ml1 .view').innerHTML=''
                        $('#Ml1 .view').append(svg)
                        if(svg.width.baseVal.unitType==7) escala = svg.width.baseVal.value/vb.width // SVG em mm
                        else escala = 25.4/96 // SVG em pixels (96 DPI)
                        const Largura = vb.width/10
                        const Altura  = vb.height/10
                        let dist=0
                        $$('path,line,polyline,polygon,rect,circle,ellipse',svg).forEach(e=>{if(e.getTotalLength) dist+=e.getTotalLength()})
                        dist*=escala
                        const VAL_M1 = 0.68 // Valor M¹ do Corte
                        const Metro  = dist/1000
                        const Valor  = Metro*VAL_M1
                        $('#Ml1 .out').textContent =
                           `Tamanho      : ${Largura.toFixed(1)}cm x ${Altura.toFixed(1)}cm
                            Comprimento  : ${Metro.toFixed(2)}m
                            Valor        : ${RS(Valor)}
                            `
                    }
                </script>

                <script> 
                    async function Calc_COR(e){
                        const [Cores,Img]=await Calc_Prcnt_COR(e)
                        const Lista=Object.entries(Cores).sort((a,b)=>a[1]-b[1])
                        const Lista2=Lista.filter(e=>e[0]!='Branco')
                        const Dividir=(Cores.Branco||0)/Lista2.length
                        ListCOR=Lista2.map(([c,v])=>[c,v+Dividir])
                        const Barra=L=>'<div class="CorBarra">'+L.map(([Cor,val])=>{
                            const RGB=HH.CORES[Cor],Txt=RGB[0]+RGB[1]+RGB[2]>400?'#000':'#fff'
                            return `<div class="Ct" style="width:${val}%;background:rgb(${RGB});color:${Txt}">${val.toFixed(2)}%</div>`
                        }).join('')+'</div>'
                        $('#Ml2 .out').innerHTML=Barra(Lista)+Barra(ListCOR)
                        Inn('#Ml2 .view','')
                        $('#Ml2 .view').append(Img)
                        Calc_Valor_COR(ListCOR)
                    }

                    function Calc_Valor_COR(ListCOR){
                        const G=c=>$('#Ml2 '+c)
                        const Material=G('.Material').value
                        const Largura=+G('.Larg').value||0
                        const Altura=+G('.Alt').value||0
                        const Corte=+G('.IptVal').value||0
                        const Chapa=HH.PVC[Material]||0
                        const Metro=Chapa/(1.22*2.44)
                        const PVC=Largura*Altura*Metro
                        const Total=PVC+Corte
                        G('.Inform'  ).innerHTML=`Chapa Inteira: ${RS(Chapa)}<br>Valor M²: ${RS(Metro)}<br>`
                        G('.CustoPVC').innerHTML=`PVC: ${RS(PVC)}<br>Corte: ${RS(Corte)}<br>`
                        G('.Tottal'  ).innerHTML=`<h2>Total: ${RS(Total)}</h2>`
                        G('.Valores' ).innerHTML=ListCOR.map(([Cor,val])=>`<div class="ValCor"><span class="Bolinha" style="background:rgb(${HH.CORES[Cor]})"></span><span>${RS(Total*val/100)}</span></div>`).join('')
                    }
                </script>
