<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Img/Fav_Infinity_2.png">
    <title>GRD2</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="./Biblioteca/CSSBiblioteca.css" rel="stylesheet">
    <script src="./Biblioteca/PreScript.js"></script>
    <script src="./BiliotecaGRAFF/DadosClientes.js"></script>
    <link href="./BiliotecaGRAFF/CssGRAFF.css" rel="stylesheet">
    <script src="./BiliotecaGRAFF/BaseGRAFF.js"></script>
    <script src="./BiliotecaGRAFF/BiblGRAFF.js"></script>
    <script src="./BiliotecaGRAFF/SB_Crud.js"></script>
    <script src="./SB/SB_Login.js"></script>
    <script src="./BiliotecaGRAFF/supaBASE.js"></script>
</head>
<body>

<div id="Classificador">
    <div id="Contador"></div>
    <img id="ImagemAtual" alt="Imagem para classificar" hidden>
    <div id="NomeArquivo"></div>
    <div id="Mensagem">Pressione uma tecla de 1 a 9</div>
</div>

<style>
    #Classificador {display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:85vh; font-family:Arial; text-align:center;}
    #ImagemAtual {max-width:90vw; max-height:70vh; object-fit:contain; background:white; border-radius:8px;}
    #Contador {font-size:24px; font-weight:bold;}
    #NomeArquivo {font-size:16px;}
    #Mensagem {font-size:20px; color:#a855f7;}
</style>

<script>
    async function IniciarClassificador(sb,Bucket,Grupo="G"){
        const [Img,Contador,Nome,Msg]=["ImagemAtual","Contador","NomeArquivo","Mensagem"].map(id=>document.getElementById(id));
        const Storage=sb.storage.from(Bucket);
        const Col=Grupo+"_", Foto="_"+Grupo;
        const Linhas=[];
        let Atual=0, Salvando=false;

        // Buscar toda a tabela
        for(let i=0;;i+=1000){
            const {data,error}=await sb.from("GRD2").select("*").order("Id").range(i,i+999);
            if(error){Msg.textContent=error.message;return}
            Linhas.push(...data);
            if(data.length<1000)break;
        }

        // Separar os grupos de colunas
        const Grupos=Object.fromEntries(
            ["G","B","I","U","RR","W","J","T"].map(G=>[
                G,Linhas.map(L=>({Id:L.Id,[G]:L[G],[G+"_"]:L[G+"_"],["_"+G]:L["_"+G]}))
            ])
        );

        // Filtrar somente imagens não classificadas
        const Lista=Grupos[Grupo].filter(L=>
            (L[Col]==null||L[Col]==="")&&L[Foto]
        );

        function Mostrar(){
            Img.hidden=true;
            const L=Lista[Atual];

            if(!L){
                Contador.textContent="Concluído!";
                Nome.textContent="";
                Msg.textContent="Todas as imagens foram classificadas.";
                return;
            }

            Contador.textContent=`${Atual+1} / ${Lista.length}`;
            Nome.textContent=L[Grupo];
            Msg.textContent="Carregando imagem...";

            Img.onload=()=>{Img.hidden=false;Msg.textContent="Pressione 1 a 9"};
            Img.onerror=()=>{Msg.textContent="Erro ao abrir imagem"};

            Img.src=Storage.getPublicUrl("Grd2/"+L[Foto]).data.publicUrl;
        }

        async function Teclado(e){
            if(!/^[1-9]$/.test(e.key)||e.repeat)return;
            e.preventDefault();
            if(Salvando||Img.hidden||!Lista[Atual])return;

            Salvando=true;
            const L=Lista[Atual];
            Msg.textContent="Salvando...";

            try{
                const {data,error}=await sb.from("GRD2")
                    .update({[Col]:Number(e.key)})
                    .eq("Id",L.Id).select("Id");

                if(error)throw error;
                if(!data?.length)throw new Error("Linha não atualizada");

                L[Col]=Number(e.key);
                Atual++;
                await Mostrar();
            }catch(e){Msg.textContent=e.message}
            finally{Salvando=false}
        }

        document.addEventListener("keydown",Teclado);
        await Mostrar();
        return ()=>document.removeEventListener("keydown",Teclado);
    }

    IniciarClassificador(supaBASE,"uploads","G");
</script>

</body>
</html>
