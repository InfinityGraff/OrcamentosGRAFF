<style>
    .Boxxyy{box-shadow: 0 0 30px #c864ff33, 0 0 50px #ff64961a}
    .Grf   {background:#1e1e2f; border-radius:20px; padding:10px}
    .Grf30 {max-width:30% ;max-height:300px}
    .Grf50 {max-width:48% ;max-height:300px}
    .Grf100{max-width:100%;max-height:300px}

    .CalBox{background:#1e1e2f;border-radius:18px;padding:20px;color:#ffffff;width:100%;box-sizing:border-box}
    .CalTopo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
    .CalTopo h2{margin:0 auto 0 0;color:#c084fc}
    .CalTopo select,.CalTopo input,.CalTopo button{background:#303047;color:#ffffff;border:1px solid #484866;border-radius:8px;padding:8px}
    .CalAno{width:80px}
    .CalHeat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:15px}
    .CalMes{background:#29293b;padding:12px;border-radius:12px;min-width:0}
    .CalMes h3{text-align:center;color:#c084fc;font-size:16px}
    .CalGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
    .CalSemana{text-align:center;color:#a6a6b8;font-size:11px;padding:3px 0}
    .CalDia{aspect-ratio:1;min-width:0;border-radius:5px;display:flex;align-items:center;justify-content:center;font:600 12px Arial;color:#182018;cursor:default}
    .CalDia:hover{outline:2px solid #c084fc;outline-offset:1px}
    @media(max-width:850px){.CalHeat{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:500px){.CalHeat{grid-template-columns:1fr}}

    .DashMedias{display:flex;gap:15px;margin:15px 0;flex-wrap:wrap}
    .DashMedias>div{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:16px;background:linear-gradient(145deg,#303047,#222233);border:1px solid #45455f;color:#bcbcd0;font-size:14px;box-shadow:0 5px 20px #0003;transition:.25s}
    .DashMedias>div:hover{transform:translateY(-4px);border-color:#c084fc;box-shadow:0 8px 25px #c084fc25}
    .DashMedias b{font-size:30px;font-weight:700;color:#c084fc;line-height:1.2}
    .DashMedias span{font-size:17px;font-weight:600;color:#4ade80}
    .DashEtapa {padding:5px; border-radius:10px; width:100px; height:100px}
    .DashEtapa svg{width: 50px; height: 50px;}
    .DashEtapa b{display:block;font-size:22px}
</style>

<body data-Base="Infinity" data-Tema="Dark" data-Cor="Roxo" class="grid">

                        <canvas class="Grfc_VPxAv Grf Grf30" ></canvas> <!--Gráfico de Valor de Pagamento  "SomaUniq"--> 
                        <div class="DashMedias Grf30">

                        <div    class="ListaSERV w100 Ct gap"></div>

<script>
    const Top3=obj=>Object.fromEntries(Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,4))
    function OrdDash(obj,desc=true){return Object.fromEntries(Object.entries(obj).sort((a,b)=>desc ? b[1]-a[1] : a[1]-b[1]));}

    async function RfreshGrafic(){
        const [Cont,Soma]=await Promise.all([Dash('SERV','Serv','ContUniq'),Dash('SERV','Serv','SomaUniq','Valr')]);
        const Dados=gGMix(OrdDash(Cont),Soma);
        Load_Grfc('Barra',$('.Grfc_Servs'),Dados                                                                                ,'Rank de Serviço'   ,{horizontal:false,valores:false,moeda:false,misto:true })
        Load_Grfc('Barra',$('.Grfc_Meses'),gG(             await Dash('SERV','Serv','ContMes' ,'Todos' ),'Cont Serv por mês' ,0),'Cont Serv por mês' ,{horizontal:false,valores:false,moeda:false,misto:false}) // pode ser 'Todos'
        Load_Grfc('Pizza',$('.Grfc_PixAv'),gG(     OrdDash(await Dash('PGMT','Form','ContUniq'        )),'Tipos de Pagamento',1),'Tipos de Pagamento',{horizontal:false,valores:false,moeda:false,misto:false})
        Load_Grfc('Barra',$('.Grfc_VPxAv'),gG(Top3(OrdDash(await Dash('PGMT','Form','SomaUniq','Valr'))),'Tipos de Pagamento',1),'Tipos de Pagamento',{horizontal:true ,valores:true ,moeda:true ,misto:false})
        Inn('.ListaSERV',['Todos',...ObjKey(       OrdDash(await Dash('SERV','Serv','ContUniq'       )))].map(e=>`<p class="button PT" style="height:20px" onclick="RodaMes('${e}')">${e}</p>`).join(''))
    }
    async function RodaMes(e){
        Load_Grfc('Barra',$('.Grfc_Meses'),gG(        await Dash('SERV','Serv','ContMes' ,e),'Cont Serv por mês'         ,0),'Cont Serv por mês',{horizontal:false,valores:false,moeda:false,misto:false}) // pode ser 'Todos'
    }
    async function RefreshResumo(Ano=2026){
        const D=await Get_Resumo(Ano)

        const BRL=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
        $('.MediaDia').textContent=Number(D.MediaDia).toLocaleString('pt-BR')
        $('.MediaMes').textContent=Number(D.MediaMes).toLocaleString('pt-BR')
        $('.ValorDia').textContent=BRL(D.ValorDia)
        $('.ValorMes').textContent=BRL(D.ValorMes)

        Load_Grfc('Pizza',$('.Grfc_Grad'),gG(D.Grad,'Com / Sem Grad',1))
        Load_Grfc('Pizza',$('.Grfc_Arte'),gG(D.Arte,'Com / Sem Arte',1))

        Inn('.DashEtapas',ObjEtr(D.Etapas).sort((a,b)=>b[1]-a[1]).map(([chave,q])=>{
            const Split=chave.split('-')
            const Svg=SVGEtapas[Split[0]]||''
            const Bg=COR1[Split[1]]||'0,0,0'
            const Cor=COR2[Split[1]]||'255,255,255'
            return `<div class="DashEtapa Cl" style="background:rgba(${Bg});color:rgb(${Cor});fill:rgb(${Cor})">
                ${Svg}<span>${Split[0]}</span><b>${q.toLocaleString('pt-BR')}</b></div>`
        }).join(''))
    }
</script>

<script>
    async function Get_Calendar(Serv='Todos',Ano=2026){
        const {data,error}=await supaBASE.rpc('dash_cal',{servico:Serv,ano:Ano}); if(error)throw error; return data||{};
    }
    async function Get_Resumo(Ano=2026){
        const {data,error}=await supaBASE.rpc('dash_resumo',{ano:Ano});
        if(error)throw error;
        return data;
    }
    
    function RenderCalHeat(Div,Dados,Ano){
        const CalMeses  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
        const CalSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']
        function CorCal(q,max,fds){if(!q && fds)return '#454552'; return `rgba(192,132,252,${max ? q/max : 0})`;}
        const Max=Math.max(0,...Object.values(Dados).map(Number));
        let html='';
        for(let m=0;m<12;m++){
            const primeiro=new Date(Ano,m,1).getDay();
            const total=new Date(Ano,m+1,0).getDate();
            html+=`<div class="CalMes">
                <h3>${CalMeses[m]}</h3>
                <div class="CalGrid">
                ${CalSemana.map(d=>`<div class="CalSemana">${d}</div>`).join('')}
                ${'<div></div>'.repeat(primeiro)}`;
            for(let dia=1;dia<=total;dia++){
                const data=`${Ano}-${String(m+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
                const q=Number(Dados[data])||0;
                const fds=[0,6].includes(new Date(Ano,m,dia).getDay());
                html+=`<div class="CalDia" style="background:${CorCal(q,Max,fds)};color:#fff" title="${data} — ${q} serviços">${dia}</div>`;
            }
            html+='</div></div>';
        }
        $('.CalHeat',Div).innerHTML=html;
    }

    async function RefreshCal(Div){
        const Serv=       $('.CalServ',Div).value
        const Ano =Number($('.CalAno' ,Div).value)
        const Dados=await Get_Calendar(Serv,Ano)
        RenderCalHeat(Div,Dados,Ano)
    }

</script>
