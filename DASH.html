<script>
    const CalMeses  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const CalSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

    async function DashCal(Serv='Todos',Ano=new Date().getFullYear()){
        const {data,error}=await supaBASE.rpc('dash_cal',{servico:Serv,ano:Ano});
        if(error)throw error;
        return data||{};
    }

    function CorCal(q,fds){
        if(!q)return fds?'#454552':'#ffffff';
        return ['','#dcfce7','#86efac','#4ade80','#16a34a','#166534'][Math.min(q,5)];
    }

    function RenderCalHeat(Div,Dados,Ano){
        const heat=Div.querySelector('.CalHeat');
        let html='';

        for(let m=0;m<12;m++){
            const primeiro=new Date(Ano,m,1).getDay();
            const total=new Date(Ano,m+1,0).getDate();

            html+=`<div class="CalMes">
                <h3>${CalMeses[m]}</h3>
                <div class="CalGrid">
                ${CalSemana.map(d=>`<div class="CalSemana">${d}</div>`).join('')}
                ${'<div></div>'.repeat(primeiro)}`;

            for(let dia=1;dia<=total;dia++){
                const data=`${Ano}-${String(m+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
                const q=Number(Dados[data])||0;
                const fds=[0,6].includes(new Date(Ano,m,dia).getDay());

                html+=`<div class="CalDia"
                    style="background:${CorCal(q,fds)};color:${q>=4?'#fff':'#182018'}"
                    title="${data} — ${q} serviços">${dia}</div>`;
            }

            html+='</div></div>';
        }
        heat.innerHTML=html;
    }

    async function RefreshCal(Div){
        const Serv=Div.querySelector('.CalServ').value;
        const Ano=Number(Div.querySelector('.CalAno').value);
        const Dados=await DashCal(Serv,Ano);
        RenderCalHeat(Div,Dados,Ano);
    }

    RefreshCal(document.querySelector('.CalBox'));
</script>
