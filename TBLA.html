<script> // ---- PESQUISA ----
    const oPesq = {Aa:'Aa',A_:'[]',In:'<',Ot:'>',_C:'~',Bj:'Bj'}

    const Tm_Pesq=Typ=>
    `<div class="pPesq Pesq_${Typ} hOv Rltv">
        <input class="w100" placeholder="Pesquisar em ${D_Brev[Typ]}..." oninput="DOM_Pesq('${Typ}')" onkeydown="KeyEntr(()=>SB_Pesq('${Typ}'))">
        <div class="Abslt Ct gap" style="top:8px;right:8px">
            ${ObjKey(oPesq).map(e=>`<a class="AaAa Pesq-${e}" onclick="TOV(this);SB_Pesq('${Typ}')">${oPesq[e]}</a>`).join('')}
            <img class="AaAa" style="width:17px" onclick="SB_Pesq('${Typ}')" src="./SVG/Icon_Lupa.svg">
        </div>
        <a class="AaAa Abslt PT" style="left:8px;top:8px" onclick="Tog_N(this);Tog($('.COL1',Avo(this)),'NONE')">▼</a>
        <select class="COL1 Abslt NONE" style="top:0px;left:0px;width:70px">${Tm_Opt(BS[Typ].Orden)}</select>
    </div>`

    function DOM_Pesq(Typ){
        const busca = Trim($(`.Pesq_${Typ} input`).value)
        const [Aa,A_,In,Ot,_C,Bj] = ObjKey(oPesq).map(e=>!!$(`.Pesq_${Typ} .Pesq-${e}.Atv`))
        const getV = (j,c)=>{
            if(!BS[Typ].FK?.includes(c)) return [String(j[c])]
            return (j[c]||[]).map(x=>{let v = x[c] ; while(typeof v==='object'&&v!==null) v=Object.values(v)[0] ; return String(v)})
        }
        const isMatch=(j)=>{
            for(const c in j){const vals = getV(j,c) ; if(vals.some(v=>String(v).toLowerCase().includes(busca.toLowerCase()))) return true}
            return false
        }
        const Res = J[Typ].filter(isMatch)
        $$(`#H_${Typ} > tbody > tr`).forEach(tr=>Add_N(tr))
        Res.forEach(j=>{const tr = $(`#H_${Typ} > tbody > .tr-${j.Id}`) ; if(tr) Rmv_N(tr)})
        DOM_Grif(Typ,busca?[busca.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),Aa,_C]:null)
        Re_Foot(Typ)
    }

    async function SB_Pesq(Typ,Col){
        const busca1=Trim($(`.Pesq_${Typ} input`).value)
        const busca2= Col ? Trim($(`.PesqCol_${Typ}_${Col}`).value) : null
        /*Gambiarra*/ const busca = Col ? busca2 : busca1
        const [Aa,A_,In,Ot,_C,Bj] = ObjKey(oPesq).map(e=>!!$(`.Pesq_${Typ} .Pesq-${e}.Atv`))
        const Filt = busca?{search:busca,...(Col?{column:Col}:{}),options:{Aa,A_,In,Ot,_C},filtrarInternos:Bj}:null
        LOG('FINAL',Typ,Col,[Aa,A_,In,Ot,_C,Bj],Filt)
        return GetTable(Typ,Filt||'Vazio')
    }
</script>

    async function Tm_Filt(Eu,Typ,col,Bs){   // ✔️ RENDERIZA FILT DOM Depende da Tabela Carregada
        BSFIL[Typ]??={} ; if(BSFIL[Typ][col]==true){return} ; BSFIL[Typ][col]=true // evitar carrergar 2 vezes
        const Onclk =e=>`onclick="F_Clik(this,'${Typ}','${col}','${e}');Ex_Filt('${Typ}','${col}','${Bs}')"`
        const Tm_FList=(arr,Typ,col)=>arr.map(e=>`<div class="Ct w100"><a class="PT RD HOV" ${Onclk(e)}>-</a><p data-Typ="${Typ}" data-Col="${col}">${e}</p><a class="PT RD HOV" ${Onclk(e)}>+</a></div>`).join('')
        
        const Lista = //Typ=="PDDS" && col=='Stts' ? ListEtps.map(e=>`${e[0]} <a style="fill:rgb(${COR1[e[1]]})">${SVGEtapas[e[0]]}</a>`) :
                      Bs == 'SB'        ? await SB_Uniq(Typ,col) :
                      Bs =='J'          ? Uniq(J[Typ].map(E=>E[col])) :
                      Bs.includes('J-') ? Uniq(J[Typ].flatMap(E=>Array.isArray(E.OS)?E.OS.map(x=>x[Bs.split('-')[1]]):[])) :
                      Bs.includes('O-') ? O[Bs.split('-')[1]]         :
                      Bs =='Date'       ? ''                          :
                      'nada'
        const NovoArry = Lista.map(e=>e===''?"'Vazio'":e).sort(e=>e==="'Vazio'"?-1:1)
        Inn($('.Sugg',Eu),Tm_FList(NovoArry,Typ,col))
    }
    
    function F_Clik(Eu,Typ,col,val){         // ✔️ Pinta o Filt com Ativo e Desativo
        const [r,a]=['ThFilt_Rtv','ThFilt_Atv']
        const PP = $('p',Pai(Eu)) // Valor Clicado
        if(Inn(Eu)=='-'){if(Coten(PP,a)){Rmv(PP,a)}else{Tog(PP,r)}}
        if(Inn(Eu)=='+'){if(Coten(PP,r)){Rmv(PP,r)}else{Tog(PP,a)}}
        const Notifi=e=>{const l = $$(`.ThFilt_${e}`,_th(Eu)).length ; const n = $(`b.${e}`,_th(Eu)) ; if(l==0){None(n)}else{Show(n)} ; Inn(n,l) } // Atualiza Notificações + ou -
        Notifi('Atv') ; Notifi('Rtv')
    }
    
    function Ex_Filt(Typ){                   // ✔️ (Typ,col,Bs) 
        const aTV=$$(`#H_${Typ} > thead .ThFilt_Atv`).map(e=>[e.dataset.col,Txt(e)]);
        const rTV=$$(`#H_${Typ} > thead .ThFilt_Rtv`).map(e=>[e.dataset.col,Txt(e)]);
        const Agrupar=Arr=>Object.groupBy(Arr,([col])=>col)
        const Pos=Agrupar(aTV),Neg=Agrupar(rTV)
        const Filtros=[]
        for(const [col,pares] of Object.entries(Pos)) Filtros.push(     {field:col,op:'in',value:pares.map(e=>e[1])})
        for(const [col,pares] of Object.entries(Neg)) Filtros.push({not:{field:col,op:'in',value:pares.map(e=>e[1])}})
        const Filt = Filtros.length?{and:Filtros}:null
        return GetTable(Typ,Filt)
    }
    
    function F_Clen(Typ){                    // ✔️ Limpa todos os Filtros
        //TRs(Typ).forEach(e=>{For(20).forEach(E=>Rmv(e,`n${E}`)) ; Bkg(e,'')}) // Exibe todas as Linhas e Limpa o Random
        $$('.ThFilt b'  ).forEach(e=>None(e)) // Limpa Notifi dos Filter
        const Class = ['ThFilt_Atv','ThFilt_Rtv','SelectSoma']
        Class.forEach(e=>{$$(`.${e}`).forEach(E=>{Rmv(E,e)})})
    }
</script>

<script> // ---- ORDEN ----
    function Orden(e,ev,x,order=null){      // ✔️
        const AllI    =(table,Atv=null)=>$$(`:scope > thead > tr > th ${Atv=='Atv'?'i.Atv':'i'}`,table)
        function TogSeta(e,asc){AllI(_table(e)).forEach(i=>{DTV(i);i.textContent='▼'});const atu = SibQSl(e,'i') ; ATV(atu) ; atu.textContent = asc?'▼':'▲'}
        const table = _table(e)
        const cOl = $('p',_th(e))
        const TBODY = $('tbody',table) // TBODYID ver se o melhor seria isso
        const asc = order ? order === 'asc' : table.dataset.sortOrder !== "asc"
        const Get=E=>$('.P-P',E.children[x])

        const Ordn = [...TBODY.rows].sort((a,b)=>{                    
            if(KeyCtrl(ev)){ // se tiver com Cntrl Selecionado faz o Filtro por Caracteres
                const lenA = (VAL(Get(a)) || '').length
                const lenB = (VAL(Get(b)) || '').length
                return asc ? lenA - lenB : lenB - lenA
            }
            if(cOl=='Data'){
                // 📅 Se ambos forem datas válidas (ex: "2024-12-03")
                    const dateA = new Date(VAL(Get(a)).trim() || '2000-01-01')
                    const dateB = new Date(VAL(Get(b)).trim() || '2000-01-01')           
                    if(!isNaN(dateA) && !isNaN(dateB)){return asc ? dateA-dateB : dateB-dateA}
            }
            // Ordena se for Numeros
                const valA = parseFloat(Txt(Get(a)).replace('R$',''))
                const valB = parseFloat(Txt(Get(b)).replace('R$',''))
                if(!isNaN(valA) && !isNaN(valB)){return asc ? valA-valB : valB-valA}
                
            // Ordena como texto se não forem números
                const txtA = `${VAL(Get(a))}`.replace('R$','')
                const txtB = `${VAL(Get(b))}`.replace('R$','')
                return asc ? txtA.localeCompare(txtB) : txtB.localeCompare(txtA)
        })
        table.dataset.sortOrder = asc ? "asc" : "desc"
        Ordn.forEach(r=>TBODY.appendChild(r))
        TogSeta(e,asc)

        // Voltar ordem ao Normal
    }
</script>

                if(isArr(V)) AutoCOMP(Key,V)

                const fn=COMP?.[Typ]?.[c] ; const V=fn?.(j) ?? ''  // Coleta o Valor
                j[c]=V ; JJ?.[Typ]?.[j.Id] && (JJ[Typ][j.Id][c]=V) // Aplica os J e JJ
            })
        })  
    }

    async function SB_Link(Eu,Val,R,Escape){
        const [Typ,Id,Col] = R.split('-'),COL=AA(Col)
        if(COL=='CLNT' && !Escape){
            if(!confirm(`${COL} ${Val} não existe.\nCriar Cliente agora?`)) return
            const NewID = await SB_AddROW(COL,{Clnt:Val})
            await supaBASE.from(Typ).update({[Col]:NewID}).eq('Id',Id)
            LOG('Adicionou Novo Cliente')
        }else{
            LOG('Analisa',COL)
            const Exs = await supaBASE.from(COL).select('Id').eq('Id',Val).single() // Conferir se Existe
            if(!Exs.data){
                const TBLLA = {'GRAD':{Id:Val,OS:null,Uber:null}}
                if(!confirm(`${COL} ${Val} não existe.\nCriar agora?`)) return
                await supaBASE.from(COL).insert(TBLLA[COL]||{Id:Val})
            }
            await supaBASE.from(Typ).update({[Col]:Val}).eq('Id',Id)
        }
        Read_Tr(_tr(Eu),Typ,Id)
    }

    }

<script> // Config BS
    function RenderBS(Typ){
        const List=['COL','TM','TH','FOOT','CLS','NONE','SRC'] // ['COL','TM','CLS','NONE','SRC','TH','LINK','LnkEX','FOOT','DPCK','COR','AUTO']
        const Obj=BS[Typ].Json
        const Edit=(k,k2)=>`contenteditable onblur="UpdateJSON('${Typ}','${k}','${k2}',this)"`
        const Keys=ObjKey(Obj)
        Tog_N($(`#InfoBS_${Typ}`))
        Inn($(`#InfoBS_${Typ}`),`
            <div class="InfoBS w95 Ct Gap">${
                ObjEtr(BS[Typ]).map(([k,v])=>{if(['Id','Tabela','Json'].includes(k)){return ''}
                return `<div><p>${k}:</p><div contenteditable>${v}</div></div>`}).join('')}</div>
            <table class="w100">
                <thead><tr><th>.</th>${Keys.map(k=>`<th ${Edit(k,'KEY')}>${k}</th>`).join('')}</tr></thead>
                <tbody>${List.map(p=>`<tr><th class="SB_ID">${p}</th>${Keys.map(k=>`<td ${Edit(k,p)}>${Obj[k]?.[p]??''}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>`
        )
    }
    function UpdateJSON(Typ,key,prop,el){
        const Row=BS[Typ]
        let val=el.innerText
        const json=typeof Row.Json=='string'?JSON.parse(Row.Json):structuredClone(Row.Json)
        if(prop=='KEY'){
            val=val.trim()
            if(!val || val==key || json[val]) return
            json[val]=json[key]
            delete json[key]
        }else{
            if(!json[key] || json[key][prop]==val) return
            json[key][prop]=val
        }
        Sb_EDIT('BS',Row.Id,{Json:Row.Json=json})
    }
</script>
